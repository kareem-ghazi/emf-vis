<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="nablaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- Swirling Field Line (Vector Circulation) -->
  <path d="M14 36 C16 48, 48 48, 50 34 C51 24, 40 18, 28 20" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <polygon points="12,33 16,39 20,33" fill="#f59e0b"/>

  <!-- Bold Nabla ∇ (Inverted Vector Gradient Triangle) -->
  <polygon points="18,18 46,18 32,44" fill="none" stroke="url(#nablaGrad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Core Luminous Probe Dot -->
  <circle cx="32" cy="27" r="3" fill="#38bdf8"/>
</svg>
